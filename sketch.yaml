# The board settings, core and library versions this firmware is tested with. arduino-cli uses this profile for
# every compile and upload in this folder, and downloads what it lists on the first build.
profiles:
  daycard:
    fqbn: esp32:esp32:esp32s3:CDCOnBoot=cdc,FlashSize=16M,FlashMode=qio,PartitionScheme=esp_sr_16,PSRAM=opi,USBMode=hwcdc,LoopCore=0
    platforms:
      - platform: esp32:esp32 (3.3.12)
        platform_index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    libraries:
      - U8g2 (2.36.19)
      - ArduinoJson (7.4.3)
      - WiFiManager (2.0.17)
default_profile: daycard
